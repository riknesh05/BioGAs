<!DOCTYPE html>
<html>
<head>
  <title>Biogas Dashboard</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background:#0b1220; color:white; text-align:center; font-family:Arial; }
    .card { display:inline-block; padding:15px; margin:10px; background:#111827; border-radius:10px; }
    canvas { max-width:90%; }
  </style>
</head>

<body>

<h2>🌱 Biogas Dashboard</h2>

<div class="card">Methane: <span id="mq4">--</span></div>
<div class="card">Gas Index: <span id="mq2">--</span></div>
<div class="card">Digester Temp: <span id="dig">--</span></div>
<div class="card">Ambient Temp: <span id="temp">--</span></div>
<div class="card">Humidity: <span id="hum">--</span></div>

<canvas id="chart"></canvas>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBfyHgxeO0lgCi6-_0i3DknM84JlT3bvdc",
  databaseURL: "https://biogas-yogi-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let labels = [], methane = [];

const chart = new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels: labels,
    datasets: [{ label: "Methane", data: methane }]
  }
});

db.ref("sensor").on("value", snap => {
  const d = snap.val();
  if (!d) return;

  document.getElementById("mq2").innerText = d.mq2;
  document.getElementById("mq4").innerText = d.mq4;
  document.getElementById("temp").innerText = d.dhtTemp;
  document.getElementById("hum").innerText = d.humidity;

  const dig = ((d.temp1 + d.temp2)/2).toFixed(1);
  document.getElementById("dig").innerText = dig;

  const t = new Date().toLocaleTimeString();

  labels.push(t);
  methane.push(d.mq4);

  if (labels.length > 20) {
    labels.shift();
    methane.shift();
  }

  chart.update();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Biogas Monitoring Dashboard</title>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <!-- CHART -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      background:
        linear-gradient(
          135deg,
          #050b16,
          #0b1220,
          #111827
        );

      color: white;

      font-family:
        Arial,
        sans-serif;

      min-height: 100vh;

      padding: 20px;

      overflow-x: hidden;
    }

    h1 {

      text-align: center;

      color: #4ade80;

      font-size: 42px;

      margin-top: 20px;

      letter-spacing: 2px;
    }

    .subtitle {

      text-align: center;

      color: #94a3b8;

      margin-top: 10px;

      margin-bottom: 40px;

      font-size: 18px;
    }

    .container {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(230px, 1fr)
        );

      gap: 20px;

      max-width: 1400px;

      margin: auto;
    }

    .card {

      background:
        rgba(15, 23, 42, 0.95);

      border:
        1px solid rgba(74, 222, 128, 0.08);

      border-radius: 20px;

      padding: 25px;

      text-align: center;

      transition: 0.3s;

      box-shadow:
        0 0 25px rgba(0,0,0,0.3);
    }

    .card:hover {

      transform:
        translateY(-6px);

      box-shadow:
        0 0 30px rgba(74,222,128,0.18);
    }

    .title {

      color: #94a3b8;

      font-size: 18px;

      margin-bottom: 18px;

      line-height: 1.4;
    }

    .value {

      font-size: 42px;

      color: #4ade80;

      font-weight: bold;
    }

    .unit {

      margin-top: 8px;

      color: #94a3b8;

      font-size: 14px;
    }

    .statusBox {

      margin-top: 40px;

      text-align: center;
    }

    .statusTitle {

      color: #94a3b8;

      margin-bottom: 10px;

      font-size: 18px;
    }

    .status {

      font-size: 28px;

      font-weight: bold;
    }

    .chartContainer {

      margin-top: 40px;

      background:
        rgba(15, 23, 42, 0.95);

      border-radius: 20px;

      padding: 20px;

      max-width: 1400px;

      margin-left: auto;

      margin-right: auto;

      box-shadow:
        0 0 25px rgba(0,0,0,0.3);
    }

    canvas {

      width: 100% !important;

      height: 500px !important;
    }

    .footer {

      margin-top: 40px;

      text-align: center;

      color: #64748b;

      font-size: 14px;
    }

    @media(max-width: 768px) {

      h1 {
        font-size: 32px;
      }

      .value {
        font-size: 34px;
      }

      canvas {
        height: 350px !important;
      }
    }

  </style>

</head>

<body>

  <h1>🌱 BIOGAS MONITOR</h1>

  <div class="subtitle">
    Real-Time Smart Digester Monitoring System
  </div>

  <!-- SENSOR CARDS -->
  <div class="container">

    <!-- MQ2 -->
    <div class="card">

      <div class="title">
        Combustible Gas Index
      </div>

      <div
        class="value"
        id="mq2"
      >
        --
      </div>

    </div>

    <!-- MQ135 -->
    <div class="card">

      <div class="title">
        MQ135 Gas Composition
      </div>

      <div
        class="value"
        id="mq135"
      >
        --
      </div>

    </div>

    <!-- PRESSURE -->
    <div class="card">

      <div class="title">
        Digester Pressure
      </div>

      <div
        class="value"
        id="pressure"
      >
        --
      </div>

      <div class="unit">
        kPa
      </div>

    </div>

    <!-- AMBIENT TEMP -->
    <div class="card">

      <div class="title">
        Ambient Temperature
      </div>

      <div
        class="value"
        id="temp"
      >
        --
      </div>

      <div class="unit">
        °C
      </div>

    </div>

    <!-- HUMIDITY -->
    <div class="card">

      <div class="title">
        Humidity
      </div>

      <div
        class="value"
        id="hum"
      >
        --
      </div>

      <div class="unit">
        %
      </div>

    </div>

    <!-- DIGESTER TEMP -->
    <div class="card">

      <div class="title">
        Digester Temperature
      </div>

      <div
        class="value"
        id="dig"
      >
        --
      </div>

      <div class="unit">
        °C
      </div>

    </div>

  </div>

  <!-- STATUS -->
  <div class="statusBox">

    <div class="statusTitle">
      Digester State
    </div>

    <div
      class="status"
      id="status"
    >
      Initializing...
    </div>

  </div>

  <!-- CHART -->
  <div class="chartContainer">

    <canvas id="chart"></canvas>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    Biogas Analytics System • Firebase Realtime Monitoring
  </div>

  <script>

    // ==========================================
    // FIREBASE CONFIG
    // ==========================================
    const firebaseConfig = {

      apiKey:
        "AIzaSyBfyHgxeO0lgCi6-_0i3DknM84JlT3bvdc",

      authDomain:
        "biogas-yogi.firebaseapp.com",

      databaseURL:
        "https://biogas-yogi-default-rtdb.firebaseio.com",

      projectId:
        "biogas-yogi",

      storageBucket:
        "biogas-yogi.firebasestorage.app",

      messagingSenderId:
        "983187935593",

      appId:
        "1:983187935593:web:1920bc95765519af4e6df8"
    };

    // ==========================================
    // INIT FIREBASE
    // ==========================================
    firebase.initializeApp(firebaseConfig);

    const db =
      firebase.database();

    const sensorRef =
      db.ref("sensor");

    // ==========================================
    // CHART DATA
    // ==========================================
    let labels = [];

    let gasData = [];

    let pressureData = [];

    // ==========================================
    // CHART
    // ==========================================
    const ctx =
      document.getElementById("chart");

    const chart =
      new Chart(ctx, {

        type: "line",

        data: {

          labels: labels,

          datasets: [

            {

              label:
                "MQ135 Gas Composition",

              data:
                gasData,

              borderColor:
                "#4ade80",

              backgroundColor:
                "rgba(74,222,128,0.08)",

              fill: true,

              tension: 0.4,

              borderWidth: 3
            },

            {

              label:
                "Digester Pressure (kPa)",

              data:
                pressureData,

              borderColor:
                "#60a5fa",

              backgroundColor:
                "rgba(96,165,250,0.08)",

              fill: true,

              tension: 0.4,

              borderWidth: 3
            }
          ]
        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          interaction: {

            mode: "index",

            intersect: false
          },

          plugins: {

            legend: {

              labels: {

                color: "white",

                font: {
                  size: 14
                }
              }
            }
          },

          scales: {

            x: {

              ticks: {

                color: "white"
              },

              grid: {

                color:
                  "rgba(255,255,255,0.05)"
              }
            },

            y: {

              ticks: {

                color: "white"
              },

              grid: {

                color:
                  "rgba(255,255,255,0.05)"
              }
            }
          }
        }
      });

    // ==========================================
    // FIREBASE LISTENER
    // ==========================================
    sensorRef.on(

      "value",

      (snapshot) => {

        const d =
          snapshot.val();

        console.log(
          "Firebase Data:",
          d
        );

        if (!d) return;

        // ======================================
        // SAFE VALUES
        // ======================================
        const mq2 =
          d.mq2 ?? 0;

        const mq135 =
          d.mq135 ?? 0;

        const pressure =
          Number(
            d.pressure ?? 0
          );

        const dhtTemp =
          Number(
            d.dhtTemp ?? 0
          );

        const humidity =
          Number(
            d.humidity ?? 0
          );

        const digesterTemp =
          Number(
            d.digesterTemp ?? 0
          );

        // ======================================
        // UPDATE UI
        // ======================================
        document
          .getElementById("mq2")
          .innerText =
          mq2;

        document
          .getElementById("mq135")
          .innerText =
          mq135;

        document
          .getElementById("pressure")
          .innerText =
          pressure.toFixed(2);

        document
          .getElementById("temp")
          .innerText =
          dhtTemp.toFixed(1);

        document
          .getElementById("hum")
          .innerText =
          humidity.toFixed(1);

        document
          .getElementById("dig")
          .innerText =
          digesterTemp.toFixed(1);

        // ======================================
        // DIGESTER STATUS
        // ======================================
        let status =
          "⚠️ Digester Disturbed";

        let color =
          "#f59e0b";

        if (
          digesterTemp >= 28 &&
          digesterTemp <= 40 &&
          pressure > 5
        ) {

          status =
            "✅ Healthy Anaerobic Digestion";

          color =
            "#22c55e";
        }

        else if (
          digesterTemp < 25
        ) {

          status =
            "❄️ Low Digestion Activity";

          color =
            "#60a5fa";
        }

        else if (
          pressure <= 5
        ) {

          status =
            "⚠️ Low Gas Pressure";

          color =
            "#ef4444";
        }

        document
          .getElementById("status")
          .innerText =
          status;

        document
          .getElementById("status")
          .style.color =
          color;

        // ======================================
        // UPDATE GRAPH
        // ======================================
        const time =
          new Date()
          .toLocaleTimeString();

        labels.push(time);

        gasData.push(mq135);

        pressureData.push(pressure);

        // LIMIT GRAPH
        if (
          labels.length > 20
        ) {

          labels.shift();

          gasData.shift();

          pressureData.shift();
        }

        chart.update();
      },

      (error) => {

        console.error(
          "Firebase Error:",
          error
        );
      }
    );

  </script>

</body>
</html>
